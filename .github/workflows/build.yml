name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    name: Compile & Test (SBT + Android SDK)
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Java 8 (project requires source/target 1.6 compat) ───────────────
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # ── 3. Android SDK (platform android-23, build-tools 23.0.2) ─────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform & build-tools
        run: |
          sdkmanager "platforms;android-23" "build-tools;23.0.2"

      # ── 4. SBT (project uses 0.13.8 declared in project/build.properties) ───
      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      # ── 5. Cache SBT & Ivy ───────────────────────────────────────────────────
      - name: Cache SBT
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.ivy2/cache
            ~/.coursier/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/plugins.sbt', '**/build.properties') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # ── 6. Set dummy credentials (same as Travis PR workaround) ──────────────
      - name: Set dummy S3 credentials
        run: |
          echo "S3_ACCESS_KEY=invalid" >> $GITHUB_ENV
          echo "S3_SECRET_KEY=invalid" >> $GITHUB_ENV

      # ── 7. Compile & Test ────────────────────────────────────────────────────
      - name: sbt compile test
        run: sbt compile test
